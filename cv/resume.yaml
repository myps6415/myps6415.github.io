experience:
  - company: {zh: 旺旺中時媒體集團, en: Want Want China Times Media Group}
    role: {zh: 主任資料工程師（Data Lead）, en: Data Lead · Principal Data Engineer}
    period: {zh: 2026.04 – 現在, en: Apr 2026 – present}
    bullets:
      - zh: 建立跨平台資料平台：FB、IG、Threads、YouTube、GA4 資料經 34 個 Cloud Run Jobs 進 BigQuery，以 dbt 建模。
        en: Built a data platform that brings Facebook, Instagram, Threads, YouTube and GA4 data into BigQuery through 34 Cloud Run Jobs, modelled with dbt.
      - zh: 交付三個給非工程師的上線產品：集團營收儀表板、社群成效儀表板、報紙版面 PDF 產製工具。
        en: "Shipped three production tools for non-engineers: a group revenue dashboard, a social-performance dashboard and a newspaper-layout PDF generator."
      - zh: 以 Gemini 上線留言與貼文分類、編輯台助理與留言 RAG，每週自動評測，未達標會告警。
        en: Put Gemini into production for comment and post classification, an editors' assistant and comment search, with weekly automated evaluation that alerts below threshold.
      - zh: 建置業務部的簽核系統（Cloud Run 與 Cloud SQL），權限與稽核紀錄實作在資料庫層。
        en: Built the sales department's approval system on Cloud Run and Cloud SQL, with permissions and the audit trail enforced in the database.
      - zh: 依稽核紀錄收窄服務帳號權限，上線前逐一測試 10 種情境。
        en: Reduced service-account permissions to what audit logs showed was used, testing 10 cases before rollout.
      - zh: 營收資料管線月成本從 $300 降到 $1 以下；找出 dashboard 帳單偏高的原因，Cloud Run 運行時數減少約六成。
        en: Cut a revenue pipeline from $300 to under $1 a month, and found why dashboards were costly, reducing Cloud Run instance hours by about 60%.
      - zh: 建立團隊的決策紀錄、新人 onboarding 與跨專案知識庫。
        en: Set up the team's decision records, onboarding and a cross-project knowledge base.

