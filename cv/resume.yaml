      - zh: Fluentd 地端 → GCP Cloud Storage ETL 自動化、Airflow 每日資料演算、導入 PySpark 分散式處理，並規劃整體資料架構。
        en: Automated on-prem → GCP Cloud Storage ETL with Fluentd, daily Airflow computations, introduced PySpark for distributed processing and planned the overall data architecture.

  - company: {zh: 痞客邦 PIXNET, en: PIXNET}
    role: {zh: 高級演算法工程師, en: Senior Algorithm Engineer}
    period: {zh: 2021.09 – 2022.11, en: Sep 2021 – Nov 2022}
    bullets:
      - zh: >-
          <b>從零建置 GKE 上的 Fluentd 收集服務 fluenthub</b>（6 副本滾動更新、Ingress + 靜態 IP）寫入 GCS／BigQuery，用 Spark 重放 40 萬筆真實文章壓測：峰值約 1,900 req/s、0 錯誤；Search Console API 每日 900 萬筆採集；排序與推薦演算法、SEO。
        en: >-
          <b>Built fluenthub from zero, a Fluentd collection service on GKE</b> (6 replicas with rolling updates, Ingress + static IP) writing to GCS/BigQuery; load-tested by replaying 400k real articles through Spark: ~1,900 req/s peak, zero errors. Search Console API collection at 9M rows/day; ranking and recommendation algorithms; SEO.

