        en: Ansible-deployed Fluentd fleets (GCE + on-prem IDC) streaming into BigQuery; AWS Data Pipeline cross-cloud ETL; automated Data Studio reporting; gender prediction for anonymous users and customer algorithms (XGBoost/RandomForest/SVM).

