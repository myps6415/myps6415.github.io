    en: Data Lead with a data engineering background
  eyebrow:
    zh: Data Lead · Data Engineering · Cloud Platform · AI 應用
    en: Data Lead · Data Engineering · Cloud Platform · Applied AI
  summary:
    zh: >-
      十年資料工程經驗，其中兩年半帶領 Data Team。2026 年 4 月起在旺旺中時從零建立集團的 Data／AI 平台，使用者是主管、行銷與編輯，都不是工程師；部署、權限到監控告警都自己建、自己維運。接手的營收資料管線月成本從 $300 降到不到 $1；留言 RAG 與編輯台 agent 都有每週評測，品質低於門檻就讓排程失敗。
    en: >-
      Ten years in data engineering, two and a half of them leading a Data Team. Since April 2026 I have built the group's Data/AI platform at Want Want China Times from zero, for executives, marketing leads and editors, none of them engineers, and run it myself from deployment and IAM to monitoring. I cut an inherited revenue pipeline from $300 to under $1 a month, and both the comment RAG layer and the newsroom agent have weekly evals that fail the job when quality drops.
