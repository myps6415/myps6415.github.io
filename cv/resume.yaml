experience:
  - company: {zh: 旺旺中時媒體集團, en: Want Want China Times Media Group}
    role: {zh: 主任資料工程師（Data Lead）, en: Data Lead · Principal Data Engineer}
    period: {zh: 2026.04 – 現在, en: Apr 2026 – present}
    bullets:
      - zh: >-
          <b>從零打造集團跨平台資料平台</b>：Facebook／Instagram／Threads／YouTube／GA4 端到端 ingestion，34 個 Cloud Run Jobs 錯峰排程寫入 BigQuery（append-only 保留完整歷史），dbt 建模；以 Cloud Scheduler + Cloud Run Jobs 取代 Composer 控成本，dbt source freshness + 帳號級守門 + Cloud Monitoring 抓「job 成功卻沒寫資料」的靜默失敗。
        en: >-
          <b>Built the group's cross-platform data platform from zero</b>: Facebook, Instagram, Threads, YouTube and GA4 ingestion — 34 staggered Cloud Run Jobs writing append-only history into BigQuery, modelled with dbt. Cloud Scheduler + Cloud Run Jobs instead of Composer to control cost; dbt source freshness, account-level checks and Cloud Monitoring catch "job succeeded but wrote nothing" silent failures.
      - zh: >-
          <b>接手營收 pipeline 重寫，月成本 $300 → <$1</b>；並交付三個給非工程師的上線產品：集團數位營收儀表板（C-level）、社群成效儀表板（行銷主管／編輯）、月營收一覽表報紙版面 PDF 產製工具。Google 登入 + 三層 ACL，主管在頁面內自助增刪成員，不必找工程師。
        en: >-
          <b>Rewrote an inherited revenue pipeline, $300 → under $1 a month</b>; shipped three production tools for non-engineers: a group revenue dashboard (C-level), a social-performance dashboard (marketing and editors) and a tool that typesets monthly revenue tables into print-ready newspaper PDFs. Google sign-in and a three-tier ACL let managers add and remove users themselves.
      - zh: >-
          <b>生成式 AI 上生產，而且有守門</b>：BigQuery <span class="mono">AI.GENERATE</span>（Gemini）做留言情緒與貼文主題分類、只依當期數字的接地式 AI 觀點；Vertex 嵌入 + KMEANS 把負評分群命名；留言 RAG 檢索搭每週 LLM-as-judge 評測，品質跌破門檻即讓 job 失敗。編輯台 4 工具 agent 上線：不寫 SQL、強制自檢、成本上限，每週回放評測。
        en: >-
          <b>Generative AI in production, with guardrails</b>: BigQuery <span class="mono">AI.GENERATE</span> (Gemini) classifies comment sentiment and post topics and writes commentary grounded in current figures only; Vertex embeddings + KMEANS cluster and name negative-comment themes; a comment RAG layer is gated by a weekly LLM-as-judge eval that fails the job when quality drops. A four-tool newsroom agent is live — no free-form SQL, mandatory self-check, hard cost caps, weekly replay eval.
      - zh: >-
          <b>建立團隊的治理與交付方式</b>：資料治理盤點、成本歸屬 label、對 IT／維運方的資料存取需求清單、決策紀錄、新人 onboarding 階梯、跨專案知識庫 dd-knowledge、給主管與新進 DE 的專案簡報；為 AI agent 訂 repo 契約層（禁區、驗收指令、守門），讓人與 agent 在同一套規則下協作。
        en: >-
          <b>Set up how the team governs and delivers</b>: data-governance inventory, cost-attribution labels, an access-request list negotiated with IT, decision records, staged onboarding, a cross-project knowledge base and a project briefing for executives and new engineers; a repo contract layer (no-go zones, acceptance commands, guards) so people and AI agents work under the same rules.

  - company: {zh: 澄映科技, en: Cleflex Technology}
    role: {zh: Data Team Lead, en: Data Team Lead}
    period: {zh: 2023.05 – 2025.10, en: May 2023 – Oct 2025}
    bullets:
      - zh: >-
          <b>帶領 4 人 Data Team</b>，負責排程、優先序與交付品質；以 Scrum（每日站會、衝刺規劃、回顧）與 Jira／GitLab 運作，並與產品團隊合作把資料自動化成 Superset 儀表板供決策。
        en: >-
          <b>Led a four-person Data Team</b> — scheduling, prioritisation and delivery quality — running Scrum (stand-ups, sprint planning, retros) on Jira/GitLab, and partnering with product to turn data into Superset dashboards used for decisions.
      - zh: >-
          Airflow 資料爬取 ETL（Scrapy → S3／MongoDB）、定時讀取 ElasticSearch 供 AI 自動評論、Telegram 異常告警；建置 Apache Iceberg + Spark 資料湖（Lakehouse）支援分散式分析，以 Docker／makefile 標準化部署讓成員快速起環境。
        en: >-
          Airflow crawling ETL (Scrapy → S3/MongoDB), scheduled Elasticsearch reads feeding AI reviews, Telegram alerts; built an Apache Iceberg + Spark lakehouse for distributed analysis and standardised deployment with Docker/makefiles so teammates could stand up environments fast.

